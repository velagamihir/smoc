<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook Preview</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        width: 500px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .post {
        padding: 0;
      }
      .post-header {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #ddd;
        flex-shrink: 0;
      }
      .header-content {
        flex: 1;
      }
      .page-name {
        font-weight: 600;
        font-size: 14px;
        color: #050505;
        margin-bottom: 2px;
      }
      .timestamp {
        font-size: 12px;
        color: #65676b;
      }
      .menu {
        font-size: 16px;
        color: #65676b;
        cursor: pointer;
      }
      .post-content {
        padding: 0 16px 12px;
      }
      .text {
        font-size: 14px;
        line-height: 1.4;
        color: #050505;
        margin-bottom: 8px;
      }
      .post-image {
        width: 100%;
        height: 300px;
        background: #f0f0f0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #666;
        font-size: 14px;
      }
      .engagement {
        padding: 8px 16px;
        border-top: 1px solid #e4e6ea;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #65676b;
      }
      .actions {
        padding: 4px 16px;
        display: flex;
        justify-content: space-around;
      }
      .action {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12px;
        color: #65676b;
        cursor: pointer;
        padding: 8px 0;
        flex: 1;
        border-radius: 4px;
      }
      .action:hover {
        background: #f2f3f5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="post">
        <div class="post-header">
          <div class="avatar"></div>
          <div class="header-content">
            <div class="page-name">Page Name</div>
            <div class="timestamp">1h</div>
          </div>
          <div class="menu">⋯</div>
        </div>
        <div class="post-content">
          <div class="text">[Post content text here]</div>
          <div class="post-image">[Post Image/Visual]</div>
        </div>
        <div class="engagement">
          <span>👍 123</span>
          <span>12 comments • 5 shares</span>
        </div>
        <div class="actions">
          <div class="action">👍 Like</div>
          <div class="action">💬 Comment</div>
          <div class="action">↻ Share</div>
        </div>
      </div>
    </div>

    <script>
      // Get post data from localStorage
      const storedData = localStorage.getItem("postPreviewData");
      const postData = storedData
        ? JSON.parse(storedData)
        : {
            clientName: "Client Name",
            caption: "This is a sample Facebook post content for preview.",
            creative: "",
            headline: "",
            body_copy: "",
          };

      // Update the preview
      document.querySelector(".page-name").textContent = postData.clientName;
      document.querySelector(".text").textContent = postData.caption;

      // Display image if available
      const imageContainer = document.querySelector(".post-image");
      if (postData.creative) {
        imageContainer.innerHTML = `<img src="${postData.creative}" style="width: 100%; height: 100%; object-fit: cover;" alt="Post image">`;
      } else {
        imageContainer.textContent = "[No Image]";
      }
    </script>
  </body>
</html>
