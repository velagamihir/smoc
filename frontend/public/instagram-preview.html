<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Preview</title>

    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fafafa;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .phone {
        width: 375px;
        height: 667px;
        background: black;
        border-radius: 35px;
        padding: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .screen {
        background: white;
        height: 100%;
        border-radius: 25px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* HEADER */

      .header {
        padding: 12px 16px;
        border-bottom: 1px solid #dbdbdb;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        font-size: 18px;
      }

      /* POST HEADER */

      .post-header {
        display: flex;
        align-items: center;
        padding: 12px;
        justify-content: space-between;
      }

      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af);
        padding: 2px;
      }

      .avatar-inner {
        width: 100%;
        height: 100%;
        background: #ddd;
        border-radius: 50%;
      }

      .username {
        font-weight: 600;
        font-size: 14px;
      }

      .verified {
        color: #3897f0;
        font-size: 13px;
      }

      /* IMAGE */

      .post-image {
        width: 100%;
        height: 360px;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .post-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ACTIONS */

      .actions {
        display: flex;
        justify-content: space-between;
        padding: 10px 12px;
        font-size: 22px;
      }

      .left-actions {
        display: flex;
        gap: 14px;
      }

      /* TEXT CONTENT */

      .likes {
        font-weight: 600;
        padding: 0 14px;
        font-size: 14px;
        margin-bottom: 5px;
      }

      .caption {
        padding: 0 14px;
        font-size: 14px;
        margin-bottom: 5px;
      }

      .comments {
        padding: 0 14px;
        font-size: 14px;
        color: #8e8e8e;
        margin-bottom: 5px;
      }

      .time {
        padding: 0 14px;
        font-size: 11px;
        color: #8e8e8e;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      /* COMMENT BOX */

      .comment-box {
        border-top: 1px solid #dbdbdb;
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: #999;
      }
    </style>
  </head>

  <body>
    <div class="phone">
      <div class="screen">
        <div class="header">
          Instagram
          <div>✈️</div>
        </div>

        <div class="post">
          <div class="post-header">
            <div class="user-info">
              <div class="avatar">
                <div class="avatar-inner"></div>
              </div>

              <div class="username">
                brand_name <span class="verified">✔</span>
              </div>
            </div>

            <div>⋯</div>
          </div>

          <div class="post-image">Image</div>

          <div class="actions">
            <div class="left-actions">
              <span>♡</span>
              <span>💬</span>
              <span>✈️</span>
            </div>

            <span>🔖</span>
          </div>

          <div class="likes">1,234 likes</div>

          <div class="caption">
            <strong>brand_name</strong> Sample caption for this Instagram
            preview post.
          </div>

          <div class="comments">View all 82 comments</div>

          <div class="time">2 hours ago</div>

          <div class="comment-box">Add a comment...</div>
        </div>
      </div>
    </div>

    <script>
      const storedData = localStorage.getItem("postPreviewData");

      const postData = storedData
        ? JSON.parse(storedData)
        : {
            clientName: "brand_name",
            caption: "This is a sample caption for the Instagram post preview.",
            creative: "",
          };

      document.querySelector(".username").innerHTML =
        `${postData.clientName} <span class="verified">✔</span>`;

      document.querySelector(".caption").innerHTML =
        `<strong>${postData.clientName}</strong> ${postData.caption}`;

      const imageContainer = document.querySelector(".post-image");

      if (postData.creative) {
        imageContainer.innerHTML = `<img src="${postData.creative}" alt="post image">`;
      } else {
        imageContainer.innerHTML = "No Image";
      }
    </script>
  </body>
</html>
